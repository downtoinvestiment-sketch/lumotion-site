# Ripubblica il sito su GitHub Pages a ogni push su main.
# Serve perché i push fatti da app esterne (per esempio Claude) non fanno partire
# da soli la pubblicazione di GitHub Pages: qui la chiediamo esplicitamente.
name: Pubblica su GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  pages: write
jobs:
  pubblica:
    runs-on: ubuntu-latest
    steps:
      - name: Chiedi a GitHub Pages di pubblicare main
        run: |
          curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds"
